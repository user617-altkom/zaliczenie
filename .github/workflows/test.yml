name: Testy

on:
  push:
  pull_request:

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
